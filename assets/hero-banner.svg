<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%" role="img" aria-label="Fitra Romeo Winky — AI Engineer &amp; Full-Stack Developer">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070B14" />
      <stop offset="50%" stop-color="#0B1120" />
      <stop offset="100%" stop-color="#111827" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.55" />
      <stop offset="50%" stop-color="#1E293B" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0.55" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <radialGradient id="cyanGlow" cx="18%" cy="22%" r="35%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="indigoGlow" cx="85%" cy="80%" r="38%">
      <stop offset="0%" stop-color="#818CF8" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#818CF8" stop-opacity="0" />
    </radialGradient>

    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1E293B" stroke-width="0.7" stroke-opacity="0.45" />
    </pattern>
  </defs>

  <!-- Canvas & Ambient Lighting -->
  <rect width="1000" height="300" rx="18" fill="url(#bgGrad)" />
  <rect width="1000" height="300" rx="18" fill="url(#grid)" />
  <rect width="1000" height="300" rx="18" fill="url(#cyanGlow)" />
  <rect width="1000" height="300" rx="18" fill="url(#indigoGlow)" />
  <rect x="1" y="1" width="998" height="298" rx="17" fill="none" stroke="url(#borderGrad)" stroke-width="1.5" />

  <!-- Top Eyebrow Pill -->
  <rect x="44" y="28" width="322" height="28" rx="14" fill="#131C2E" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
  <text x="60" y="46" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12" font-weight="700" fill="#38BDF8">
    &gt;_ AI ENGINEER &amp; FULL-STACK DEVELOPER
  </text>

  <!-- Status Pill -->
  <rect x="790" y="28" width="166" height="28" rx="14" fill="#064E3B" fill-opacity="0.45" stroke="#10B981" stroke-opacity="0.5" stroke-width="1" />
  <circle cx="809" cy="42" r="4.5" fill="#10B981">
    <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
  </circle>
  <text x="823" y="46" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#34D399">
    Available for Hire
  </text>

  <!-- Hero Title & Role Summary -->
  <text x="44" y="104" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="800" fill="#F8FAFC" letter-spacing="-0.5">
    Hi, I'm <tspan fill="url(#titleGrad)">Fitra Romeo Winky</tspan>
  </text>

  <text x="44" y="135" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="500" fill="#94A3B8">
    Full-Stack Developer @ PT Dwi Putra Sakti  •  B.Sc. Informatics UMM (GPA 3.88)  •  East Java, Indonesia
  </text>

  <!-- Interactive-Style Console Card (Fitra OS Motif) -->
  <rect x="44" y="158" width="912" height="114" rx="12" fill="#090D16" fill-opacity="0.9" stroke="#1E293B" stroke-width="1.2" />
  <circle cx="64" cy="176" r="5" fill="#EF4444" />
  <circle cx="80" cy="176" r="5" fill="#F59E0B" />
  <circle cx="96" cy="176" r="5" fill="#10B981" />
  <text x="500" y="180" text-anchor="middle" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="11.5" fill="#64748B">
    fitra@portfolio:~$ — Fitra OS v2.4
  </text>
  <line x1="44" y1="191" x2="956" y2="191" stroke="#1E293B" stroke-width="1" />

  <text x="64" y="214" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12.5">
    <tspan fill="#10B981" font-weight="700">fitra@portfolio:~$</tspan>
    <tspan fill="#E2E8F0"> cat engineering_profile.json</tspan>
  </text>

  <text x="64" y="236" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12">
    <tspan fill="#38BDF8">"ai_vision_nlp"</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#A5F3FC">"YOLOv12", "PyTorch", "OpenCV", "BERT / DistilBERT", "Isolation Forest"</tspan><tspan fill="#94A3B8">],</tspan>
  </text>

  <text x="64" y="256" font-family="'JetBrains Mono', 'Fira Code', Consolas, monospace" font-size="12">
    <tspan fill="#818CF8">"fullstack_api"</tspan><tspan fill="#94A3B8">: [</tspan><tspan fill="#C7D2FE">"Go Fiber", "FastAPI", "Django", "Laravel", "Next.js 14", "React", "PostgreSQL"</tspan><tspan fill="#94A3B8">]</tspan><tspan fill="#38BDF8"> &#9608;<animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite" /></tspan>
  </text>
</svg>
